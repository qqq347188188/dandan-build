name: Build bodian_probe.dylib

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile iOS arm64 dylib
        run: |
          SRC=$(find . -name bodian_probe.m | head -n 1)
          echo "Source file: $SRC"
          xcrun --sdk iphoneos clang -dynamiclib -arch arm64 -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -framework Foundation -framework Security \
            -o bodian_probe.dylib "$SRC"

      - name: Verify
        run: file bodian_probe.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bodian_probe.dylib
          path: bodian_probe.dylib
