name: Build dandan_unlock.dylib

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile iOS arm64 dylib
        run: |
          SRC=$(find . -name dandan_unlock.m | head -n 1)
          echo "Source file: $SRC"
          xcrun --sdk iphoneos clang -dynamiclib -arch arm64 -fobjc-arc \
            -miphoneos-version-min=15.0 \
            -framework Foundation \
            -o dandan_unlock.dylib "$SRC"

      - name: Verify
        run: file dandan_unlock.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dandan_unlock.dylib
          path: dandan_unlock.dylib
